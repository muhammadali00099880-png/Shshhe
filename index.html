<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Store</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f0c29;
            --grad: linear-gradient(135deg, #24243e, #302b63, #0f0c29);
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #00f2c3;
            --accent: #b000f2;
            --text: #fff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--grad); color: var(--text); min-height: 100vh; padding-bottom: 90px; }

        /* HEADER */
        .header {
            padding: 20px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 22px; font-weight: 700; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* LEADERBOARD CARD */
        .leader-card {
            background: linear-gradient(45deg, #FFD700, #FFA500); color: black;
            margin: 20px; padding: 20px; border-radius: 15px; text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); animation: float 3s infinite ease-in-out;
        }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

        /* PRODUCTS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card {
            background: var(--glass); border: 1px solid var(--border); border-radius: 15px; overflow: hidden;
            position: relative; backdrop-filter: blur(5px);
        }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .p-details { padding: 12px; }
        .discount-badge { position: absolute; top: 10px; left: 10px; background: var(--accent); padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .price-area { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
        .old-price { text-decoration: line-through; color: #aaa; font-size: 12px; }
        .new-price { color: var(--primary); font-weight: bold; font-size: 16px; }

        .btn-vip {
            width: 100%; padding: 12px; border: none; background: linear-gradient(90deg, var(--primary), #00d2ff);
            color: black; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; transition: 0.2s;
        }
        .btn-vip:active { transform: scale(0.98); }
        .btn-vip:disabled { background: #555; color: #aaa; cursor: wait; }

        /* ORDERS */
        .order-item {
            background: rgba(255,255,255,0.03); margin: 15px; padding: 15px; border-radius: 12px; border: 1px solid var(--border);
        }
        .access-btn {
            display: block; background: #00e676; color: black; text-align: center; padding: 12px;
            border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        /* CHAT & NOTIFICATIONS */
        .notif-bar { background: var(--accent); color: white; padding: 10px; margin: 15px; border-radius: 8px; font-size: 13px; display: none; }
        .chat-box { height: 60vh; overflow-y: auto; padding: 15px; }
        .msg { padding: 8px 12px; margin: 5px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .msg.me { background: var(--primary); color: black; align-self: flex-end; margin-left: auto; }
        .msg.admin { background: #333; color: white; }

        /* PROFILE */
        .profile-head { text-align: center; padding: 30px; }
        .p-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; }

        /* NAV */
        .nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(20,20,20,0.9); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 50px; padding: 15px 25px;
            display: flex; justify-content: space-between; z-index: 100;
        }
        .nav i { font-size: 22px; color: #777; transition: 0.3s; }
        .nav i.active { color: var(--primary); transform: translateY(-5px); text-shadow: 0 0 10px var(--primary); }
        
        /* AUTH */
        .auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .auth-box { width: 100%; max-width: 350px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
        input { width: 100%; padding: 15px; background: #222; border: 1px solid #444; color: white; margin: 5px 0; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--primary); }

        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-screen">
        <h1 class="logo" style="font-size: 30px; margin-bottom: 20px;">VIP ACCESS</h1>
        
        <!-- Login Form -->
        <div id="login-form" class="auth-box">
            <h3 style="margin-bottom:10px;">Login</h3>
            <input id="l-email" type="email" placeholder="Email Address">
            <input id="l-pass" type="password" placeholder="Password">
            <button id="btn-login" class="btn-vip" onclick="login()">LOGIN</button>
            <p style="margin-top:15px; text-align:center; color:#aaa; font-size:13px; cursor:pointer;" onclick="toggleAuth('reg')">Create New Account</p>
        </div>

        <!-- Register Form -->
        <div id="reg-form" class="auth-box" style="display:none;">
            <h3 style="margin-bottom:10px;">Register</h3>
            <input id="r-name" type="text" placeholder="Full Name">
            <input id="r-email" type="email" placeholder="Email Address">
            <input id="r-pass" type="password" placeholder="Password (Min 6 chars)">
            <button id="btn-reg" class="btn-vip" onclick="reg()">REGISTER NOW</button>
            <p style="margin-top:15px; text-align:center; color:#aaa; font-size:13px; cursor:pointer;" onclick="toggleAuth('login')">Back to Login</p>
        </div>
    </div>

    <!-- APP SCREEN -->
    <div id="app-screen" style="display:none;">
        
        <div class="header">
            <div class="logo">VIP STORE</div>
            <div id="wallet-display" style="font-size:12px; color:#aaa;">Loading...</div>
        </div>

        <!-- GLOBAL NOTIFICATION -->
        <div id="global-alert" class="notif-bar">
            <i class="fa fa-bullhorn"></i> <span id="alert-text"></span>
        </div>

        <!-- HOME TAB -->
        <div id="home-view" class="view">
            <!-- LEADERBOARD -->
            <div class="leader-card">
                <h3>🏆 Today's Top Buyer</h3>
                <h1 id="top-buyer-name">...</h1>
                <p id="top-buyer-amt" style="font-size:12px;">Spent: 0</p>
            </div>
            <div id="prod-list" class="grid"></div>
        </div>

        <!-- ORDERS TAB -->
        <div id="orders-view" class="view" style="display:none;">
            <h2 style="padding:20px;">My Orders</h2>
            <div id="order-list"></div>
        </div>

        <!-- CHAT TAB -->
        <div id="chat-view" class="view" style="display:none;">
            <h2 style="padding:20px;">Live Support</h2>
            <div id="chat-box" class="chat-box"></div>
            <div style="padding:10px; display:flex; gap:10px; background:black; position:fixed; bottom:90px; width:100%;">
                <input id="chat-inp" placeholder="Type message...">
                <button class="btn-vip" style="width:60px; margin-top:0;" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- PROFILE TAB -->
        <div id="profile-view" class="view" style="display:none;">
            <div class="profile-head">
                <img id="prof-pic" src="https://via.placeholder.com/100" class="p-img">
                <h2 id="prof-name" style="margin-top:10px;">User</h2>
                <p id="prof-id" style="font-size:12px; color:#777;"></p>
                
                <div style="margin-top:20px; text-align:left; padding:20px; background:rgba(255,255,255,0.05); border-radius:10px;">
                    <label>Change Profile Picture (URL)</label>
                    <input id="new-pic-url" placeholder="Paste Image Link">
                    <button class="btn-vip" onclick="updatePic()">Update Picture</button>
                    <button class="btn-vip" style="background:#d32f2f; margin-top:20px;" onclick="auth.signOut(); location.reload()">Logout</button>
                </div>
            </div>
        </div>

        <!-- NAV -->
        <div class="nav">
            <i class="fa fa-home active" onclick="nav('home', this)"></i>
            <i class="fa fa-box-open" onclick="nav('orders', this)"></i>
            <i class="fa fa-comments" onclick="nav('chat', this)"></i>
            <i class="fa fa-user" onclick="nav('profile', this)"></i>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-SY2MMz3alikknihGFMnJ_BagJPwHJTE",
            authDomain: "yeyw-6301d.firebaseapp.com",
            databaseURL: "https://yeyw-6301d-default-rtdb.firebaseio.com",
            projectId: "yeyw-6301d",
            storageBucket: "yeyw-6301d.firebasestorage.app",
            messagingSenderId: "534522518126",
            appId: "1:534522518126:web:f4fdc8a04e958730d4a47f",
            measurementId: "G-31P41T4QXF"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let user = null;

        // --- FAST AUTH LOGIC ---
        
        // Ye listener foran trigger hoga jaise hi login/register complete hoga
        auth.onAuthStateChanged(u => {
            if(u) {
                user = u;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                loadData();
                calcLeaderboard();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        function toggleAuth(view) {
            if(view === 'reg') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('reg-form').style.display = 'block';
            } else {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('reg-form').style.display = 'none';
            }
        }

        function login() {
            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;
            const btn = document.getElementById('btn-login');

            if(!email || !pass) return Swal.fire('Error', 'Please fill all fields', 'warning');

            btn.innerHTML = '<div class="loader"></div> Processing...';
            btn.disabled = true;

            auth.signInWithEmailAndPassword(email, pass)
                .catch(e => {
                    Swal.fire('Login Failed', e.message, 'error');
                    btn.innerText = "LOGIN";
                    btn.disabled = false;
                });
            // Success ke liye wait nahi karna, onAuthStateChanged sambhal lega
        }

        function reg() {
            const name = document.getElementById('r-name').value;
            const email = document.getElementById('r-email').value;
            const pass = document.getElementById('r-pass').value;
            const btn = document.getElementById('btn-reg');

            if(!name || !email || !pass) return Swal.fire('Error', 'Please fill all fields', 'warning');
            if(pass.length < 6) return Swal.fire('Weak Password', 'Password must be at least 6 characters', 'warning');

            btn.innerHTML = '<div class="loader"></div> Creating Account...';
            btn.disabled = true;

            auth.createUserWithEmailAndPassword(email, pass)
                .then(c => {
                    // Background mein DB update hoga, user ko wait nahi karwayenge
                    db.ref('users/'+c.user.uid).set({
                        name: name,
                        email: c.user.email,
                        joined: Date.now()
                    });
                })
                .catch(e => {
                    Swal.fire('Registration Failed', e.message, 'error');
                    btn.innerText = "REGISTER NOW";
                    btn.disabled = false;
                });
        }

        // --- APP LOGIC ---

        function nav(id, el) {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.getElementById(id+'-view').style.display = 'block';
            document.querySelectorAll('.nav i').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function loadData() {
            // Profile
            db.ref('users/'+user.uid).on('value', s => {
                const u = s.val();
                if(u) {
                    document.getElementById('prof-name').innerText = u.name || 'User';
                    document.getElementById('prof-id').innerText = 'ID: ' + user.uid;
                    if(u.profilePic) document.getElementById('prof-pic').src = u.profilePic;
                }
            });

            // Global Alert
            db.ref('broadcast').on('value', s => {
                if(s.val()) {
                    document.getElementById('global-alert').style.display = 'block';
                    document.getElementById('alert-text').innerText = s.val().msg;
                }
            });

            // Products
            db.ref('products').on('value', snap => {
                const d = document.getElementById('prod-list');
                d.innerHTML = '';
                snap.forEach(c => {
                    const p = c.val();
                    let priceHtml = `<span class="new-price">${p.price}</span>`;
                    if(p.discount > 0) {
                        let old = parseInt(p.price) + (parseInt(p.price) * (p.discount/100));
                        priceHtml = `<span class="old-price">${Math.round(old)}</span> <span class="new-price">${p.price}</span>`;
                    }

                    d.innerHTML += `
                        <div class="card">
                            ${p.discount > 0 ? `<span class="discount-badge">${p.discount}% OFF</span>` : ''}
                            <img src="${p.image}" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="p-details">
                                <h4>${p.title}</h4>
                                <div class="price-area">${priceHtml}</div>
                                <button class="btn-vip" onclick="buy('${c.key}', '${p.title}', '${p.price}')">BUY NOW</button>
                            </div>
                        </div>
                    `;
                });
            });

            // Orders
            db.ref('orders').orderByChild('uid').equalTo(user.uid).on('value', snap => {
                const d = document.getElementById('order-list');
                d.innerHTML = '';
                snap.forEach(c => {
                    const o = c.val();
                    let btn = o.status === 'approved' 
                        ? `<a href="${o.deliveredContent}" target="_blank" class="access-btn">VIEW CONTENT / LINK</a>` 
                        : `<p style="color:orange; font-size:12px; margin-top:10px;">Waiting for Approval...</p>`;
                    
                    d.innerHTML += `
                        <div class="order-item">
                            <div style="display:flex; justify-content:space-between;">
                                <b>${o.pTitle}</b>
                                <span style="color:${o.status==='approved'?'#00e676':'orange'}">${o.status.toUpperCase()}</span>
                            </div>
                            <p style="font-size:12px; color:#aaa;">Price: ${o.price} | Trx: ${o.trxId}</p>
                            ${o.expiry ? `<p style="font-size:11px; color:#00f2c3">Expires: ${o.expiry}</p>` : ''}
                            ${btn}
                        </div>
                    `;
                });
            });

            // Chat
            db.ref('chats/'+user.uid).on('value', snap => {
                const b = document.getElementById('chat-box');
                b.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    b.innerHTML += `<div class="msg ${m.sender}">${m.text}</div>`;
                });
                b.scrollTop = b.scrollHeight;
            });
        }

        function calcLeaderboard() {
            db.ref('orders').once('value', snap => {
                let users = {};
                let today = new Date().setHours(0,0,0,0);
                snap.forEach(c => {
                    const o = c.val();
                    if(o.timestamp >= today && o.status === 'approved') {
                        if(!users[o.uid]) users[o.uid] = 0;
                        users[o.uid] += 1;
                    }
                });
                let max = 0; let winnerId = null;
                for(let uid in users) { if(users[uid] > max) { max = users[uid]; winnerId = uid; } }
                if(winnerId) {
                    db.ref('users/'+winnerId).once('value', u => {
                        document.getElementById('top-buyer-name').innerText = u.val().name;
                        document.getElementById('top-buyer-amt').innerText = "Items Bought Today: " + max;
                    });
                } else {
                    document.getElementById('top-buyer-name').innerText = "No Sales Yet";
                }
            });
        }

        function updatePic() {
            const url = document.getElementById('new-pic-url').value;
            if(url) db.ref('users/'+user.uid).update({profilePic: url});
        }

        function sendMsg() {
            const t = document.getElementById('chat-inp').value;
            if(t) { db.ref('chats/'+user.uid).push({text:t, sender:'me'}); document.getElementById('chat-inp').value=''; }
        }

        function buy(pid, title, price) {
            db.ref('adminSettings/payment').once('value', s => {
                const p = s.val() || {};
                Swal.fire({
                    title: 'Buy '+title,
                    html: `Pay <b>${price}</b><br>EasyPaisa: ${p.easy}<br>JazzCash: ${p.jazz}`,
                    input: 'text', inputPlaceholder: 'Trx ID', showCancelButton: true
                }).then(r => {
                    if(r.isConfirmed && r.value) {
                        db.ref('orders').push({
                            uid: user.uid, pid: pid, pTitle: title, price: price,
                            trxId: r.value, status: 'pending', timestamp: Date.now()
                        });
                        Swal.fire('Success', 'Order Sent', 'success');
                    }
                });
            });
        }
    </script>
</body>
</html>
